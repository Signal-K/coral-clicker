<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Coral Lab - Critical Alert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800;900&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#004f5b",
                        "tertiary": "#ffb68c",
                        "on-error": "#690005",
                        "on-surface": "#aed1da",
                        "primary-fixed": "#79f5ff",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#3f484a",
                        "background": "#001a1e",
                        "surface-container-lowest": "#000000",
                        "secondary": "#b2cbd2",
                        "on-tertiary": "#512400",
                        "on-primary-container": "#001f25",
                        "inverse-primary": "#006776",
                        "tertiary-fixed-dim": "#ffb68c",
                        "surface-container": "#002025",
                        "on-secondary-fixed": "#061f25",
                        "on-tertiary-fixed-variant": "#713600",
                        "outline": "#899294",
                        "surface-dim": "#001418",
                        "secondary-fixed-dim": "#b2cbd2",
                        "primary": "#4fd8eb",
                        "on-primary": "#00363e",
                        "on-background": "#aed1da",
                        "inverse-surface": "#aed1da",
                        "tertiary-container": "#713600",
                        "primary-fixed-dim": "#4fd8eb",
                        "inverse-on-surface": "#001f25",
                        "surface-container-highest": "#002b32",
                        "on-surface-variant": "#bfc8ca",
                        "surface-container-high": "#002b32",
                        "on-secondary-container": "#cee6ed",
                        "on-secondary-fixed-variant": "#334b51",
                        "on-primary-fixed": "#001f25",
                        "on-secondary": "#1c3339",
                        "surface-bright": "#003138",
                        "secondary-fixed": "#cee6ed",
                        "surface-variant": "#3f484a",
                        "surface-container-low": "#001a1e",
                        "surface-tint": "#4fd8eb",
                        "secondary-container": "#334b51",
                        "error-container": "#93000a",
                        "surface": "#001a1e",
                        "on-tertiary-container": "#ffdbcb",
                        "error-dim": "#ffb4ab",
                        "primary-container": "#004f5b",
                        "secondary-dim": "#b2cbd2",
                        "primary-dim": "#4fd8eb",
                        "tertiary-fixed": "#ffdbcb",
                        "on-tertiary-fixed": "#331300",
                        "tertiary-dim": "#ffb68c"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Space Grotesk", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: theme('fontFamily.body');
        }
        
        /* Tactical CRT Scanline Effect Overlay */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Pulsing Warning Gradient */
        .bg-warning-pulse {
            background: radial-gradient(circle at center, rgba(147, 0, 10, 0.3) 0%, rgba(0, 26, 30, 1) 70%);
        }

        /* Skeuomorphic Button Styles */
        .btn-skeuo-error {
            background: linear-gradient(180deg, theme('colors.error') 0%, theme('colors.error-container') 100%);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), inset 0 -2px 4px rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.5), 0 0 15px rgba(255, 180, 171, 0.3);
            border: 1px solid theme('colors.error-container');
        }
        .btn-skeuo-error:active {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.1), 0 1px 2px rgba(0,0,0,0.5);
            transform: translateY(2px);
        }

        .btn-skeuo-surface {
            background: linear-gradient(180deg, theme('colors.surface-bright') 0%, theme('colors.surface-container-highest') 100%);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -2px 4px rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.5);
            border: 1px solid theme('colors.outline-variant');
        }
        .btn-skeuo-surface:active {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), inset 0 -1px 1px rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.5);
            transform: translateY(2px);
        }

        /* Tactile Dial Styling */
        .dial-housing {
            background: linear-gradient(145deg, theme('colors.surface-container-highest'), theme('colors.surface-container-low'));
            box-shadow: 4px 4px 8px rgba(0,0,0,0.6), -4px -4px 8px rgba(255,255,255,0.05);
        }
        .dial-inner {
            background: radial-gradient(circle at 30% 30%, theme('colors.surface-container'), theme('colors.surface-container-lowest'));
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8), inset -1px -1px 2px rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden scanlines bg-warning-pulse">
<!-- Ambient Occlusion Background Element -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-bright/10 to-surface-container-highest/60 mix-blend-overlay z-0"></div>
<!-- Main Console Housing -->
<main class="relative z-10 w-full max-w-4xl p-4 md:p-8">
<!-- Sandwich Layout Panel -->
<div class="bg-surface-container-low rounded-[2rem] shadow-[0_20px_60px_-15px_rgba(147,0,10,0.4),inset_0_1px_2px_rgba(255,255,255,0.1)] border border-outline-variant/30 relative overflow-hidden flex flex-col h-[819px] min-h-[600px]">
<!-- HEADER CONTROLS (Top Sandwich Layer) -->
<header class="bg-surface-container-high p-6 border-b border-outline-variant/30 flex flex-col sm:flex-row items-center justify-between gap-6 relative z-20 shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-error text-5xl drop-shadow-[0_0_8px_rgba(255,180,171,0.6)]" style="font-variation-settings: 'FILL' 1;">warning</span>
<div>
<h2 class="font-label text-error tracking-[0.2em] text-xs uppercase mb-1">System Failure</h2>
<h1 class="font-headline font-black text-3xl md:text-4xl text-on-surface tracking-tighter leading-none drop-shadow-md">
                    CRITICAL ALERT
                </h1>
</div>
</div>
<!-- Diagnostic Dials in Header -->
<div class="flex gap-4">
<div class="dial-housing p-2 rounded-full border border-outline-variant/20 flex items-center gap-3 pr-4">
<div class="w-14 h-14 rounded-full dial-inner flex items-center justify-center relative border border-outline-variant/40">
<div class="absolute w-1.5 h-5 bg-error rounded-full drop-shadow-[0_0_4px_rgba(255,180,171,0.8)]" style="transform: rotate(140deg) translateY(-10px);"></div>
<span class="font-label text-error text-[10px] font-bold z-10">0%</span>
</div>
<div class="flex flex-col">
<span class="font-label text-on-surface-variant text-[10px] uppercase tracking-widest">Viability</span>
<span class="font-body text-error font-bold text-sm">NULL</span>
</div>
</div>
<div class="dial-housing p-2 rounded-full border border-outline-variant/20 flex items-center gap-3 pr-4">
<div class="w-14 h-14 rounded-full dial-inner flex items-center justify-center relative border border-outline-variant/40">
<div class="absolute w-1.5 h-5 bg-tertiary rounded-full drop-shadow-[0_0_4px_rgba(255,182,140,0.8)]" style="transform: rotate(45deg) translateY(-10px);"></div>
<span class="font-label text-tertiary text-[10px] font-bold z-10">32%</span>
</div>
<div class="flex flex-col">
<span class="font-label text-on-surface-variant text-[10px] uppercase tracking-widest">Toxicity</span>
<span class="font-body text-tertiary font-bold text-sm">HIGH</span>
</div>
</div>
</div>
</header>
<!-- MIDDLE VIEWPORT (The "Meat" of the Sandwich) -->
<section class="flex-1 relative overflow-hidden flex items-center justify-center p-8">
<!-- Background Image -->
<div class="absolute inset-0 z-0">
<img alt="Dark, murky underwater scene showing bleached dead coral reefs indicating ecological collapse" class="w-full h-full object-cover opacity-30 mix-blend-luminosity grayscale" data-alt="Dark, murky underwater scene showing bleached dead coral reefs indicating ecological collapse" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOk-Jb6gER4GMuKR-tRvr6Wgj_OofzMYOKgVlgg0jWb3uEuXIwOW_NWiHE15ooNoizSi-xECGZ14R-UzXAKnaUbu-eOZCs0bpiznRpP2Ppf5iWFKrBb06TbKd2s4u8zgdtO_B2dWvwIWFZX-5itUCD0Gwz89ewrW0xEtCyzxlxcWQncrg49adXslRjxBg3hOFejikgQlavDkhIXOHmR_EAao-JiI2lBv6m-fbEwOr3dBLSWFGcxSvzTfkR2HWM_Tp05T0Ch875Bh4"/>
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_0%,rgba(0,26,30,0.8)_100%)]"></div>
</div>
<!-- Inner Viewport Shadow -->
<div class="absolute inset-0 shadow-[inset_0_10px_40px_rgba(0,0,0,0.8)] pointer-events-none z-10"></div>
<!-- Floating Diagnostic Box -->
<div class="relative z-20 bg-surface-container-lowest/80 backdrop-blur-md p-6 rounded-[2rem] border border-error/30 shadow-[0_20px_40px_rgba(0,0,0,0.5),0_0_20px_rgba(147,0,10,0.2)] max-w-lg w-full text-center">
<p class="font-label text-on-surface-variant text-xs mb-2 uppercase tracking-widest">Diagnostic Report:</p>
<p class="font-headline text-error font-black text-2xl mb-2 drop-shadow-[0_0_8px_rgba(255,180,171,0.4)]">Essential Species Extinct.</p>
<p class="font-body text-on-surface/80 text-sm">Biomass stabilization protocols failed. Ecosystem collapse detected in Sector 7-G.</p>
</div>
</section>
<!-- FOOTER CONTROLS (Bottom Sandwich Layer) -->
<footer class="bg-surface-container-high p-6 border-t border-outline-variant/30 flex flex-col md:flex-row items-center justify-between gap-6 relative z-20 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<!-- Retained Data Readout -->
<div class="flex items-center gap-4 bg-surface-container-lowest px-4 py-3 rounded-full border border-outline-variant/20 shadow-[inset_2px_2px_5px_rgba(0,0,0,0.5)]">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">database</span>
<div class="flex flex-col">
<span class="font-label text-on-surface-variant text-[10px] uppercase tracking-widest">Initial Classification XP</span>
<span class="font-headline text-tertiary font-black text-sm tracking-wide">+1,450 XP</span>
</div>
</div>
<!-- Action Controls -->
<div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
<!-- Back Action -->
<button class="btn-skeuo-surface text-on-surface font-headline font-bold py-3 px-8 rounded-full transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">map</span>
<span class="tracking-widest uppercase text-sm">Abort to Map</span>
</button>
<!-- Restart Action -->
<button class="btn-skeuo-error text-on-error font-headline font-bold py-3 px-8 rounded-full transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restart_alt</span>
<span class="tracking-widest uppercase text-sm drop-shadow-sm">Restart Classification</span>
</button>
</div>
</footer>
</div>
</main>
</body></html>
