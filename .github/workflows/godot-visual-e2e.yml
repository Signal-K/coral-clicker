name: Godot Visual E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.5
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip"
          curl -fsSL "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v4.5-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_EDITOR=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run visual E2E
        run: |
          chmod +x scripts/visual-e2e-godot.sh
          SCREENSHOT_DIR="$PWD/artifacts/godot-visual-e2e" ./scripts/visual-e2e-godot.sh

      - name: Upload visual E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-visual-e2e-screenshots
          path: artifacts/godot-visual-e2e
          if-no-files-found: error
