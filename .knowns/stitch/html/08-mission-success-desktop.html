<style>

<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden pt-24 pb-28">

<header class="fixed top-0 left-0 w-full bg-surface-container/90 backdrop-blur-md border-b border-outline-variant/30 py-4 px-6 md:px-12 z-50 flex items-center justify-between tactile-panel">
<div>
<h1 class="font-headline text-3xl md:text-4xl font-black text-primary tracking-tighter drop-shadow-[0_0_8px_rgba(79,216,234,0.4)] uppercase">MISSION SUCCESS</h1>

</div>

<div class="grid grid-cols-1 md:grid-cols-12 gap-8 w-full max-w-5xl">

<span class="font-label text-on-surface">TURNS TAKEN</span>
</div>
<div class="text-right">
<span class="font-headline text-2xl font-bold text-primary">12</span>
<span class="font-label text-xs text-on-surface-variant block">/ 15 LIMIT</span>
</div>
</div>
<!-- Spacer -->
<div class="h-px w-full bg-outline-variant/50 shadow-[0_1px_0_rgba(255,255,255,0.05)]"></div>
<!-- Coins Metric -->

<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
<span class="font-label text-on-surface">COINS YIELD</span>
</div>
<div class="text-right">
<span class="font-headline text-2xl font-bold text-secondary">+250</span>
<span class="font-label text-xs text-secondary/70 block">BASE REWARD</span>
</div>
</div>
<!-- Speed Bonus -->

<span class="material-symbols-outlined text-primary text-sm">bolt</span>
<span class="font-label text-xs text-primary tracking-wider uppercase">Speed Bonus</span>
</div>
<span class="font-headline text-lg font-bold text-primary">+50</span>
</div>
</div>
</div>
<div class="mt-8 pt-6 border-t border-outline-variant/50 shadow-[0_1px_0_rgba(255,255,255,0.05)_inset]">

<span class="font-label text-sm text-on-surface-variant uppercase tracking-widest">Total Accrued</span>
<span class="font-headline text-4xl font-black text-on-surface drop-shadow-[0_0_8px_rgba(222,227,229,0.3)]">300</span>

<button class="bg-surface-container-highest text-on-surface hover:text-primary hover:bg-surface-bright border border-outline-variant/50 rounded-full px-8 py-4 flex items-center justify-center gap-3 transition-all duration-300 font-headline font-bold uppercase tracking-wide group tactile-button">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">home</span>

<!-- Next Level Button (Primary Action) -->
<button class="bg-primary text-on-primary rounded-full px-10 py-4 flex items-center justify-center gap-3 transition-all duration-300 font-headline font-black uppercase tracking-wide group hover:brightness-110 tactile-button border border-primary-container">
    Initiate Next Dive

<!-- Environmental Overlay (Subtle) -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-20">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-primary/10 via-background to-background"></div>
</div>
</body></html>
