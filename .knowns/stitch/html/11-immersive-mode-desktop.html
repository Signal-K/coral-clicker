<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

        body {
            background-color: #001f24;
            overflow: hidden;
        }
        .skeuomorphic-panel {
            background: linear-gradient(145deg, #00252b, #001a1e);
            box-shadow:  5px 5px 15px #001215, -5px -5px 15px #002c33, inset 0 2px 4px rgba(255,255,255,0.05);
            border: 1px solid rgba(0, 75, 87, 0.3);
        }
        .skeuomorphic-dial {
            background: linear-gradient(145deg, #001a1e, #00252b);
            box-shadow: inset 4px 4px 8px #001215, inset -4px -4px 8px #002c33;
            border: 2px solid #004b57;
        }
        .skeuomorphic-btn {
            background: linear-gradient(145deg, #00252b, #001a1e);
            box-shadow:  4px 4px 10px #001215, -4px -4px 10px #002c33, inset 0 1px 2px rgba(255,255,255,0.1);
            border: 2px solid #003a44;
            transition: all 0.1s ease;
        }
        .skeuomorphic-btn:active {
            background: linear-gradient(145deg, #001a1e, #00252b);
            box-shadow: inset 4px 4px 10px #001215, inset -4px -4px 10px #002c33;
            border-color: #004b57;
        }
        .glass-panel {
            background: rgba(0, 31, 36, 0.6);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 106, 113, 0.3);
