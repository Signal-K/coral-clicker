<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CORAL LAB - Shop Panel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                        "surface-container-lowest": "#000000",
                        "secondary": "#fe7e4f",
                        "on-tertiary": "#655400",

                        "inverse-primary": "#006a6c",
                        "tertiary-fixed-dim": "#efc900",
                        "surface-container": "#021d25",
                        "on-secondary-fixed": "#621c00",
                        "on-tertiary-fixed-variant": "#665500",
                        "outline": "#647981",
                        "surface-dim": "#001016",
                        "secondary-fixed-dim": "#ffb196",
                        "primary": "#52f2f5",
                        "on-primary": "#005859",
                        "on-background": "#d9eff8",
                        "inverse-surface": "#f2fbff",
                        "tertiary-container": "#ffd709",
                        "primary-fixed-dim": "#3de4e7",
                        "inverse-on-surface": "#445860",
                        "surface-container-highest": "#092933",
                        "on-surface-variant": "#99aeb7",
                        "surface-container-high": "#05232c",
                        "on-secondary-container": "#ffd2c3",
                        "on-secondary-fixed-variant": "#922f03",
                        "on-primary-fixed": "#004344",
                        "on-secondary": "#491300",
                        "surface-bright": "#0e303a",
                        "secondary-fixed": "#ffc4b1",
                        "surface-variant": "#092933",
                        "surface-container-low": "#00161d",
                        "surface-tint": "#52f2f5",
                        "secondary-container": "#8e2c01",
                        "error-container": "#9f0519",
                        "surface": "#001016",
                        "on-tertiary-container": "#5b4b00",
                        "error-dim": "#d7383b",
                        "primary-container": "#0cd0d3",
                        "secondary-dim": "#f7794b",
                        "primary-dim": "#3de4e7",
                        "tertiary-fixed": "#ffd709",
                        "on-tertiary-fixed": "#453900",
                        "tertiary-dim": "#efc900"
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"

                    fontFamily: {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Space Grotesk", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-label { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen overflow-hidden flex items-center justify-center">
<!-- Background Environment -->
<div class="absolute inset-0 z-0">
<img alt="Background" class="w-full h-full object-cover opacity-30" data-alt="underwater coral reef scene, vibrant colors, deep blue water, beams of sunlight filtering through the surface, cinematic lighting, highly detailed" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjxRIecMZ5MuI2yyzS6RfZ7nMiMbIkHZ9g0Bf-TIiu2n0lgP9v_7J8StVX6VRNjSlaoadYoLVSmezemoX2XH6R1s9UUK2C-kWbsYfTh4C6WexErblKZlLyYd-JcSmw6bhu5Dg1qUT1s8SCiuKY5A2fXq-BYzpmhatRWdod05eJ3PbbZqf2FJMo2TmW6IqWfg4SaLLib9kCy4MQTXmpqKkvGGGPxqVhZG3uiYW0UcHtH7q8ppTB4zdIWTtNzGFf-IusYGfGH3tVg54"/>
<div class="absolute inset-0 bg-gradient-to-b from-surface-bright/20 to-background/90"></div>
</div>
<!-- Shop Panel Overlay (Sandwich Layout) -->
<main class="relative z-10 w-full max-w-4xl h-[870px] md:h-[768px] flex flex-col bg-surface-container-low/90 backdrop-blur-3xl rounded-[3rem] shadow-[0_25px_80px_-15px_rgba(0,0,0,0.9),inset_0_2px_15px_rgba(82,242,245,0.05)] border border-outline-variant/40 overflow-hidden">
<!-- Top Header Console -->
<header class="w-full bg-gradient-to-b from-surface-container-high/90 to-surface-container/90 border-b border-surface-container-highest/80 p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-6 z-20 shadow-[0_10px_30px_-5px_rgba(0,0,0,0.6)]">
<!-- Title & Info -->
<div class="flex-1 w-full text-center md:text-left">
<div class="flex items-center justify-center md:justify-start gap-3 mb-2">
<div class="bg-surface-container-lowest p-2 rounded-full shadow-[inset_0_2px_8px_rgba(0,0,0,0.8),0_1px_2px_rgba(255,255,255,0.1)]">
<span class="material-symbols-outlined text-primary text-3xl drop-shadow-[0_0_8px_rgba(82,242,245,0.6)]" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<h1 class="font-headline font-black text-3xl md:text-4xl tracking-tighter uppercase text-on-surface drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">Bio-Exchange</h1>
</div>
<p class="font-label text-on-surface-variant text-sm leading-relaxed max-w-md mx-auto md:mx-0 opacity-80">
                Procure organic assets for reef deployment. Maintain sufficient energy reserves.
            </p>
</div>
<!-- Coin Balance Readout (Skeuomorphic Dial) -->
<div class="bg-gradient-to-t from-surface-container-lowest to-surface-container-low p-2 rounded-full border border-outline-variant/30 shadow-[inset_0_4px_15px_rgba(0,0,0,0.9),0_2px_10px_rgba(0,0,0,0.5)] shrink-0 w-full md:w-auto">
<div class="bg-gradient-to-b from-surface-container to-surface-container-high rounded-full px-8 py-4 border border-outline-variant/20 shadow-[inset_0_1px_1px_rgba(255,255,255,0.05)] flex items-center justify-center gap-6 relative overflow-hidden group">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-tertiary/10 to-transparent pointer-events-none opacity-50"></div>
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-tertiary text-2xl drop-shadow-[0_0_5px_rgba(255,231,146,0.6)]" style="font-variation-settings: 'FILL' 1;">toll</span>
<span class="font-label text-[10px] tracking-widest text-on-surface-variant uppercase mt-1">Reserves</span>
</div>
<div class="font-headline font-black text-5xl text-tertiary tracking-tighter drop-shadow-[0_0_15px_rgba(255,231,146,0.5)] flex items-baseline gap-1">
                    42<span class="text-2xl text-tertiary/50">.5</span>
</div>
</div>
</div>
</header>
<!-- Main Content: Inventory Grid -->
<section class="flex-grow p-8 bg-gradient-to-b from-surface-bright/5 to-transparent overflow-y-auto relative z-10">
<div class="flex justify-between items-end mb-8 border-b border-outline-variant/20 pb-4">
<h2 class="font-label text-sm tracking-widest text-primary uppercase flex items-center gap-2 drop-shadow-[0_0_5px_rgba(82,242,245,0.3)]">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                Available Species Profiles
            </h2>
<div class="font-label text-xs text-on-surface-variant bg-surface-container-lowest px-3 py-1 rounded-full border border-outline-variant/20 shadow-[inset_0_2px_5px_rgba(0,0,0,0.5)]">COST: 5 COINS / UNIT</div>
</div>
<!-- Grid (Skeuomorphic Buttons) -->
<div class="grid grid-cols-2 lg:grid-cols-3 gap-8">
<!-- Egg Button 1 -->
<button class="relative bg-gradient-to-b from-surface-container to-surface-container-low hover:from-surface-container-high hover:to-surface-container transition-all duration-300 rounded-[2rem] p-6 flex flex-col items-center justify-center gap-5 group shadow-[0_8px_20px_-5px_rgba(0,0,0,0.8),inset_0_2px_5px_rgba(255,255,255,0.05)] border border-outline-variant/20 hover:border-primary/40 active:translate-y-1 active:shadow-[0_2px_10px_-5px_rgba(0,0,0,0.8),inset_0_4px_10px_rgba(0,0,0,0.6)]">
<div class="absolute top-4 right-4 flex items-center gap-1 bg-surface-container-lowest px-3 py-1.5 rounded-full border border-tertiary/20 shadow-[inset_0_2px_5px_rgba(0,0,0,0.6)]">
<span class="material-symbols-outlined text-tertiary text-[12px] drop-shadow-[0_0_3px_rgba(255,231,146,0.5)]" style="font-variation-settings: 'FILL' 1;">toll</span>
<span class="font-label text-[12px] text-tertiary font-bold">5</span>
</div>
<div class="w-24 h-24 rounded-full bg-gradient-to-tr from-surface-container-lowest to-surface-container flex items-center justify-center group-hover:scale-105 transition-transform duration-500 shadow-[inset_0_4px_15px_rgba(0,0,0,0.9),0_0_20px_rgba(254,126,79,0.1)] border border-secondary-container/30">
<span class="material-symbols-outlined text-secondary text-5xl drop-shadow-[0_0_12px_rgba(254,126,79,0.6)]" style="font-variation-settings: 'FILL' 1;">egg</span>
</div>
<div class="text-center w-full bg-surface-container-lowest/50 py-3 rounded-full border border-outline-variant/10 shadow-[inset_0_1px_3px_rgba(0,0,0,0.3)]">
<div class="font-headline font-bold text-sm text-on-surface uppercase tracking-wider">Neon Tetra</div>
<div class="font-label text-[10px] text-on-surface-variant mt-1">Growth: Rapid</div>
</div>
</button>
<!-- Egg Button 2 -->
<button class="relative bg-gradient-to-b from-surface-container to-surface-container-low hover:from-surface-container-high hover:to-surface-container transition-all duration-300 rounded-[2rem] p-6 flex flex-col items-center justify-center gap-5 group shadow-[0_8px_20px_-5px_rgba(0,0,0,0.8),inset_0_2px_5px_rgba(255,255,255,0.05)] border border-outline-variant/20 hover:border-primary/40 active:translate-y-1 active:shadow-[0_2px_10px_-5px_rgba(0,0,0,0.8),inset_0_4px_10px_rgba(0,0,0,0.6)]">
<div class="absolute top-4 right-4 flex items-center gap-1 bg-surface-container-lowest px-3 py-1.5 rounded-full border border-tertiary/20 shadow-[inset_0_2px_5px_rgba(0,0,0,0.6)]">
<span class="material-symbols-outlined text-tertiary text-[12px] drop-shadow-[0_0_3px_rgba(255,231,146,0.5)]" style="font-variation-settings: 'FILL' 1;">toll</span>
<span class="font-label text-[12px] text-tertiary font-bold">5</span>
</div>
<div class="w-24 h-24 rounded-full bg-gradient-to-tr from-surface-container-lowest to-surface-container flex items-center justify-center group-hover:scale-105 transition-transform duration-500 shadow-[inset_0_4px_15px_rgba(0,0,0,0.9),0_0_20px_rgba(82,242,245,0.1)] border border-primary-container/30">
<span class="material-symbols-outlined text-primary text-5xl drop-shadow-[0_0_12px_rgba(82,242,245,0.6)]" style="font-variation-settings: 'FILL' 1;">egg</span>
</div>
<div class="text-center w-full bg-surface-container-lowest/50 py-3 rounded-full border border-outline-variant/10 shadow-[inset_0_1px_3px_rgba(0,0,0,0.3)]">
<div class="font-headline font-bold text-sm text-on-surface uppercase tracking-wider">Coral Grouper</div>
<div class="font-label text-[10px] text-on-surface-variant mt-1">Growth: Steady</div>
</div>
</button>
<!-- Egg Button 3 -->
<button class="relative bg-gradient-to-b from-surface-container to-surface-container-low hover:from-surface-container-high hover:to-surface-container transition-all duration-300 rounded-[2rem] p-6 flex flex-col items-center justify-center gap-5 group shadow-[0_8px_20px_-5px_rgba(0,0,0,0.8),inset_0_2px_5px_rgba(255,255,255,0.05)] border border-outline-variant/20 hover:border-primary/40 active:translate-y-1 active:shadow-[0_2px_10px_-5px_rgba(0,0,0,0.8),inset_0_4px_10px_rgba(0,0,0,0.6)]">
<div class="absolute top-4 right-4 flex items-center gap-1 bg-surface-container-lowest px-3 py-1.5 rounded-full border border-tertiary/20 shadow-[inset_0_2px_5px_rgba(0,0,0,0.6)]">
<span class="material-symbols-outlined text-tertiary text-[12px] drop-shadow-[0_0_3px_rgba(255,231,146,0.5)]" style="font-variation-settings: 'FILL' 1;">toll</span>
<span class="font-label text-[12px] text-tertiary font-bold">5</span>
</div>
<div class="w-24 h-24 rounded-full bg-gradient-to-tr from-surface-container-lowest to-surface-container flex items-center justify-center group-hover:scale-105 transition-transform duration-500 shadow-[inset_0_4px_15px_rgba(0,0,0,0.9),0_0_20px_rgba(255,231,146,0.1)] border border-tertiary-container/30">
<span class="material-symbols-outlined text-tertiary text-5xl drop-shadow-[0_0_12px_rgba(255,231,146,0.6)]" style="font-variation-settings: 'FILL' 1;">egg</span>
</div>
<div class="text-center w-full bg-surface-container-lowest/50 py-3 rounded-full border border-outline-variant/10 shadow-[inset_0_1px_3px_rgba(0,0,0,0.3)]">
<div class="font-headline font-bold text-sm text-on-surface uppercase tracking-wider">Lionfish</div>
<div class="font-label text-[10px] text-on-surface-variant mt-1">Growth: Slow</div>
</div>
</button>
<!-- Egg Button 4 (Locked) -->
<div class="relative bg-gradient-to-b from-surface-container-lowest to-background opacity-70 rounded-[2rem] p-6 flex flex-col items-center justify-center gap-5 shadow-[inset_0_10px_30px_-5px_rgba(0,0,0,0.9)] border border-outline-variant/5">
<div class="absolute top-4 right-4 flex items-center gap-1 bg-surface-container-lowest px-3 py-1.5 rounded-full border border-error/20 shadow-[inset_0_2px_5px_rgba(0,0,0,0.8)]">
<span class="material-symbols-outlined text-error text-[12px] drop-shadow-[0_0_3px_rgba(255,113,108,0.5)]" style="font-variation-settings: 'FILL' 1;">toll</span>
<span class="font-label text-[12px] text-error font-bold">50</span>
</div>
<div class="w-24 h-24 rounded-full bg-surface-container-lowest flex items-center justify-center grayscale shadow-[inset_0_4px_15px_rgba(0,0,0,0.9)] border border-outline-variant/10">
<span class="material-symbols-outlined text-outline text-5xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div class="text-center w-full bg-surface-container-lowest py-3 rounded-full border border-outline-variant/5 shadow-[inset_0_2px_5px_rgba(0,0,0,0.5)]">
<div class="font-headline font-bold text-sm text-outline uppercase tracking-wider">Manta Ray</div>
<div class="font-label text-[10px] text-error mt-1 animate-pulse">Insufficient Funds</div>
</div>
</div>
</div>
</section>
<!-- Bottom Footer Console -->
<footer class="w-full bg-gradient-to-t from-surface-container-high/90 to-surface-container/90 border-t border-surface-container-highest/80 p-6 flex justify-center md:justify-end items-center shadow-[0_-10px_30px_-5px_rgba(0,0,0,0.6)] z-20">
<!-- Close Action (Tactical Heavy Button) -->
<button class="group relative w-full md:w-auto bg-gradient-to-b from-error-container to-surface-container-lowest hover:from-error-dim hover:to-error-container transition-all duration-300 rounded-full px-10 py-5 flex items-center justify-center gap-3 shadow-[0_5px_15px_-5px_rgba(0,0,0,0.8),inset_0_2px_5px_rgba(255,255,255,0.1)] border border-error/20 active:translate-y-1 active:shadow-[0_1px_5px_-2px_rgba(0,0,0,0.8),inset_0_4px_10px_rgba(0,0,0,0.8)]">
<span class="material-symbols-outlined text-on-error-container group-hover:text-error drop-shadow-[0_0_5px_rgba(255,168,163,0.5)]" style="font-variation-settings: 'FILL' 1;">close</span>
<span class="font-headline font-bold uppercase tracking-widest text-on-error-container group-hover:text-error drop-shadow-[0_0_5px_rgba(255,168,163,0.3)]">Terminate Link</span>
</button>
</footer>
</main>
</body></html>
